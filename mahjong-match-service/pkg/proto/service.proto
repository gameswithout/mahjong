syntax = "proto3";

option csharp_namespace = "AccelByte.Extend.ServiceExtension";
option go_package = "accelbyte.net/extend/serviceextension";
option java_package = "net.accelbyte.extend.serviceextension";
option java_multiple_files = true;

package service;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

service Service {
  rpc GetJadeAccount(GetJadeAccountRequest) returns (GetJadeAccountResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/jade"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the authenticated player's Jade account"
      description: "Creates the two idempotent new-player grants when needed and returns authoritative Bamboo eligibility and available balance."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc ReserveJade(ReserveJadeRequest) returns (ReserveJadeResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/jade/reservation"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Reserve the Bamboo Courtyard debit cap"
      description: "Atomically checks eligibility and locks 300 Jade before the player creates a public matchmaking ticket."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc ReleaseJade(ReleaseJadeRequest) returns (ReleaseJadeResponse) {
    option (google.api.http) = {
      delete: "/v1/namespaces/{namespace}/jade/reservation"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Release an unbound Bamboo Courtyard reservation"
      description: "Releases the caller's queue reservation. A reservation already bound to a match remains locked until settlement."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc ClaimJadeWelfare(ClaimJadeWelfareRequest) returns (ClaimJadeWelfareResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/jade/welfare"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Claim the daily Jade welfare top-up"
      description: "Sets a locked-out balance to the 1,000-Jade Bamboo minimum, once per UTC day, for a player who has completed an AI Practice hand that day. A refused claim returns a reason code rather than an error."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc GetProgression(GetProgressionRequest) returns (GetProgressionResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/progression"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the caller's XP, level, and earned rewards"
      description: "Returns the §12.2 standing derived from lifetime XP plus the full level curve. Level never gates a lobby."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc AwardOnboardingXP(AwardOnboardingXPRequest) returns (AwardOnboardingXPResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/progression/onboarding"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Grant the one-time onboarding XP"
      description: "Awarded whether the player completed or intentionally skipped the tutorial (§10.4). Idempotent: replays grant nothing further."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // JoinMatch creates the authoritative match from the fixed AGS Session
  // roster when necessary, assigns stable seats, and returns only the
  // authenticated caller's view.
  rpc GetPlayerStatistics(GetPlayerStatisticsRequest) returns (GetPlayerStatisticsResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/statistics"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the caller's own Quick Play statistics"
      description: "Reads the caller's AGS Statistics counters (\u00a7P2.3 dashboard). Served here rather than read from AGS by the browser because the AGS Social API sends no CORS headers, so a browser cannot call it directly."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc GetMatchHistory(GetMatchHistoryRequest) returns (GetMatchHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/match-history"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the caller's completed Mahjong sessions"
      description: "Returns newest-first completed session summaries derived from the authoritative match event and XP ledgers."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc GetPlayerAchievements(GetPlayerAchievementsRequest) returns (GetPlayerAchievementsResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/achievements"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the caller's achievement catalog and exact progress"
      description: "Merges the caller's AGS Achievement progress with the complete visible Alpha achievement catalog. Entries whose tracking or game mode is unavailable remain visible with an eligibility reason."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // ListBotPersonas returns the AI Practice opponent catalog the client
  // renders as picker cards. This is the single source of truth for persona
  // display copy (bots/personas/<id>/persona.md + style.json) — the client
  // does not hold a second hand-authored copy of the same six cards, which
  // would drift the moment either side changed.
  rpc ListBotPersonas(ListBotPersonasRequest) returns (ListBotPersonasResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/bot-personas"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List the AI Practice opponent personas a player can pick"
      description: "Player-facing card content only (name, style tag, tagline, glyph, bars, one strength, one weakness) — never the internal decision weights those cards describe."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  rpc JoinMatch(JoinMatchRequest) returns (JoinMatchResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/sessions/{session_id}/matches/{match_id}/join"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Join an authoritative Mahjong match"
      description: "Creates the match from the fixed AGS Session roster when needed and returns the authenticated player's private projection."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // GetMatchState returns a caller-specific projection. Concealed tiles and
  // private claim responses belonging to other players are never included.
  rpc GetMatchState(GetMatchStateRequest) returns (GetMatchStateResponse) {
    option (google.api.http) = {
      get: "/v1/namespaces/{namespace}/sessions/{session_id}/matches/{match_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get the authenticated player's match state"
      description: "Returns the latest authoritative match projection visible to the authenticated Session member."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }

  // SubmitMatchCommand applies one idempotent player command after validating
  // Session membership, seat ownership, turn ownership, and state version.
  rpc SubmitMatchCommand(SubmitMatchCommandRequest) returns (SubmitMatchCommandResponse) {
    option (google.api.http) = {
      post: "/v1/namespaces/{namespace}/sessions/{session_id}/matches/{match_id}/commands"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Submit an authoritative Mahjong command"
      description: "Durably applies an idempotent draw, discard, or claim command and returns the authenticated player's updated projection."
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }
}

// GetPlayerStatisticsRequest asks for the authenticated caller's own
// statistics. There is deliberately no user_id field: a player reads their own
// record and nobody else's.
message GetPlayerStatisticsRequest {
  string namespace = 1;
}

// PlayerStatistic is one counter as AGS holds it. Values are returned raw;
// every rate the dashboard shows is derived client-side from these, so the
// service never has to agree with the screen about what a percentage means.
message PlayerStatistic {
  string stat_code = 1;
  double value = 2;
}

message GetPlayerStatisticsResponse {
  repeated PlayerStatistic statistics = 1;
}

message GetMatchHistoryRequest {
  string namespace = 1;
  int32 limit = 2;
}

message MatchHistoryEntry {
  string match_id = 1;
  string completed_at = 2;
  string mode = 3;
  string result = 4;
  string win_kind = 5;
  string winning_tile_id = 6;
  int32 raw_tai = 7;
  int32 xp_awarded = 8;
}

message GetMatchHistoryResponse {
  repeated MatchHistoryEntry matches = 1;
}

// GetPlayerAchievementsRequest asks for the authenticated caller's own
// achievement progress. There is deliberately no user_id field.
message GetPlayerAchievementsRequest {
  string namespace = 1;
}

message PlayerAchievement {
  string code = 1;
  string name = 2;
  string description = 3;
  double current = 4;
  double goal = 5;
  int32 xp_reward = 6;
  string bonus_reward = 7;
  bool eligible = 8;
  bool unlocked = 9;
  string unavailable_reason = 10;
}

message GetPlayerAchievementsResponse {
  repeated PlayerAchievement achievements = 1;
}

// ListBotPersonasRequest takes no picker-specific arguments: the catalog is
// the same for every caller in the namespace.
message ListBotPersonasRequest {
  string namespace = 1;
}

// PersonaBars are the five §5 display ratings, 1-5. They describe intended
// decision preferences for the picker card, not guaranteed outcomes and not
// difficulty.
message PersonaBars {
  int32 pace = 1;
  int32 value = 2;
  int32 caution = 3;
  int32 calling = 4;
  int32 concealment = 5;
}

// BotPersonaSummary is one persona's public-facing card content — the same
// fields a table already shows once a persona is seated (name, style tag,
// glyph), plus the picker-only prose (tagline, bars, strength, weakness).
// Never the internal PersonaProfile weights those cards describe.
message BotPersonaSummary {
  string id = 1;
  string name = 2;
  // Plain-language style label — "Rush", "Guard" — matching PlayerView's
  // bot_style_tag for the same persona once seated.
  string style_tag = 3;
  string tagline = 4;
  string glyph = 5;
  PersonaBars bars = 6;
  string strength = 7;
  string weakness = 8;
}

message ListBotPersonasResponse {
  repeated BotPersonaSummary personas = 1;
}

message JoinMatchRequest {
  string namespace = 1;
  string session_id = 2;
  string match_id = 3;
}

message JoinMatchResponse {
  MatchState state = 1;
}

message GetJadeAccountRequest {
  string namespace = 1;
}

message GetJadeAccountResponse {
  JadeAccount account = 1;
}

message ReserveJadeRequest {
  string namespace = 1;
}

message ReserveJadeResponse {
  JadeAccount account = 1;
  JadeReservation reservation = 2;
}

message ReleaseJadeRequest {
  string namespace = 1;
}

message ReleaseJadeResponse {
  JadeAccount account = 1;
}

message GetProgressionRequest {
  string namespace = 1;
}

message GetProgressionResponse {
  PlayerProgression progression = 1;
  // All Alpha §12.2 thresholds through the level-10 cap.
  repeated LevelStep curve = 2;
}

enum OnboardingOutcome {
  ONBOARDING_OUTCOME_UNSPECIFIED = 0;
  ONBOARDING_OUTCOME_COMPLETED = 1;
  ONBOARDING_OUTCOME_SKIPPED = 2;
}

message AwardOnboardingXPRequest {
  string namespace = 1;
  OnboardingOutcome outcome = 2;
}

message AwardOnboardingXPResponse {
  PlayerProgression progression = 1;
  HandXPAward award = 2;
  // False on an idempotent replay: award still describes the original grant.
  bool granted = 3;
}

message ClaimJadeWelfareRequest {
  string namespace = 1;
}

message ClaimJadeWelfareResponse {
  JadeAccount account = 1;
  // Whether this call granted the top-up. False with a reason code means the
  // claim was refused — an ordinary answer, not an error.
  bool granted = 2;
  int64 amount = 3;
  string reason = 4;
}

message GetMatchStateRequest {
  string namespace = 1;
  string session_id = 2;
  string match_id = 3;
}

message GetMatchStateResponse {
  MatchState state = 1;
}

enum MatchCommandType {
  MATCH_COMMAND_TYPE_UNSPECIFIED = 0;
  MATCH_COMMAND_TYPE_DRAW = 1;
  MATCH_COMMAND_TYPE_DISCARD = 2;
  MATCH_COMMAND_TYPE_SUBMIT_CLAIM = 3;
  MATCH_COMMAND_TYPE_DECLARE_ZIMO = 4;
  MATCH_COMMAND_TYPE_DECLARE_CONCEALED_KONG = 5;
  MATCH_COMMAND_TYPE_DECLARE_ADDED_KONG = 6;
}

message SubmitMatchCommandRequest {
  string namespace = 1;
  string session_id = 2;
  string match_id = 3;
  string request_id = 4;
  MatchCommandType type = 5;
  uint64 expected_version = 6;
  string tile_id = 7;
  ClaimCommand claim = 8;
  repeated string tile_ids = 9;
}

message ClaimCommand {
  string action_id = 1;
  string type = 2;
  repeated string tile_ids = 3;
  uint64 response_revision = 4;
  bool deliberate = 5;
}

message SubmitMatchCommandResponse {
  string request_id = 1;
  uint64 state_version = 2;
  string phase = 3;
  MatchState state = 4;
}

// MatchState is a privacy-filtered projection for exactly one authenticated
// player. It is not a serializable authoritative snapshot.
message MatchState {
  string match_id = 1;
  string seat = 2;
  uint64 state_version = 3;
  string phase = 4;
  string active_seat = 5;
  repeated Tile own_hand = 6;
  repeated Tile own_exposed = 7;
  repeated PlayerView players = 8;
  WallView wall = 9;
  Discard last_discard = 10;
  ClaimView claim = 11;
  bool win_locked = 12;
  repeated WaitTileView waits = 13;
  repeated Meld own_melds = 14;
  repeated Discard discards = 15;
  string turn_deadline = 16;
  HandResult hand_result = 17;
  Settlement settlement = 18;
  ContinuationOutcome next_dealer = 19;
  JadeAccount jade_account = 20;
  JadeSettlement jade_settlement = 21;
  SelfTurnOptions self_turn_options = 22;
  // §12.1 XP earned by this hand, present once the hand is complete.
  HandXPAward xp_award = 23;
  // §12.3 achievements this hand unlocked and paid for the first time. Empty
  // on a repeat projection, because their XP was already awarded.
  repeated HandXPAward achievements = 25;
  // §12.2 standing after that award.
  PlayerProgression progression = 24;
  // §8.4 Full Rotation state. Absent for Quick Play and AI Practice.
  RotationState rotation = 26;
}

// RotationState is the §8.4 Full Rotation around the current hand.
//
// Standings are keyed by player rather than by seat because a player's seat
// wind changes every time the dealership moves, so a seat does not identify
// anyone across a rotation.
message RotationState {
  // Which hand of the rotation is being played, numbered from 1.
  int32 hand_number = 1;
  int32 hands_played = 2;
  // §5.11 continuations standing behind the current hand; payout doubling remains flat.
  int32 continuations = 3;
  string dealer_user_id = 4;
  // How many of the four table positions have dealt. The rotation ends when
  // all four have, which continuations can postpone, so this rather than
  // hands_played is the measure of progress.
  int32 seats_dealt = 5;
  repeated RotationStanding standings = 6;
  // RFC 3339 instant at which §8.4's 60-minute limit expires. The hand in
  // progress then is finished before the match ends.
  string time_limit_at = 7;
  bool complete = 8;
  // "rotation_complete" or "time_limit". §8.4 makes the share of matches
  // ending on the limit a required telemetry metric, so the two endings are
  // never merged.
  string reason = 9;
  // RFC 3339 instant at which the next hand opens, set while a completed
  // hand's result is on screen and the rotation continues.
  string next_hand_opens_at = 10;
  // Final standings, present once the match is complete.
  repeated RotationPlacement placements = 11;
  // §12.1 XP for the completed rotation, paid once at the end.
  HandXPAward placement_xp_award = 12;
}

message RotationStanding {
  string user_id = 1;
  // The player's fixed table position for the whole rotation.
  string position = 2;
  // The seat wind they are playing this hand, which turns with the dealership.
  string wind = 3;
  // Table points, which start at zero and may go negative. Not an account
  // currency: §8.4 Full Rotation uses no Jade.
  int64 table_points = 4;
  int32 deal_ins = 5;
  int32 zimo_wins = 6;
  int32 raw_tai_won = 7;
  bool dealing = 8;
  bool has_dealt = 9;
}

message RotationPlacement {
  string user_id = 1;
  int32 position = 2;
  int64 table_points = 3;
  // Equal table points are a genuine rating tie (§8.4) even though the podium
  // shows an order, so anything computing Elo must not read position as a
  // strict result.
  bool rating_tie = 4;
}

message XPComponent {
  string label = 1;
  int32 amount = 2;
  string code = 3;
}

message HandXPAward {
  string source = 1;
  int32 total = 2;
  repeated XPComponent components = 3;
  // Retained so older clients can decode historical capped awards. Alpha does
  // not impose a daily XP cap, so new awards leave this false.
  bool capped_by_daily = 4;
  string award_id = 5;
}

message LevelReward {
  int32 level = 1;
  string kind = 2;
  string name = 3;
  string code = 4;
}

message LevelStep {
  int32 level = 1;
  int64 total_xp_required = 2;
  int64 xp_for_next_level = 3;
  repeated LevelReward rewards = 4;
}

message OnboardingState {
  OnboardingOutcome outcome = 1;
  string recorded_at = 2;
}

message PlayerProgression {
  int32 level = 1;
  int64 lifetime_xp = 2;
  int64 xp_into_level = 3;
  int64 xp_for_next_level = 4;
  bool at_cap = 5;
  repeated LevelReward earned = 6;
  LevelReward next = 7;
  OnboardingState onboarding = 8;
}

message TileIDSet {
  repeated string tile_ids = 1;
}

message SelfTurnOptions {
  bool can_win = 1;
  ScoreResult win_preview = 2;
  repeated TileIDSet concealed_kongs = 3;
  repeated string added_kong_tile_ids = 4;
}

message JadeAccount {
  string currency_code = 1;
  int64 balance = 2;
  int64 reserved = 3;
  int64 available = 4;
  bool eligible = 5;
  int64 minimum_balance = 6;
  int64 stake_per_tai = 7;
  int64 debit_cap = 8;
  string wallet_sync_status = 9;
  string wallet_sync_error = 10;
  // §7.5 welfare recovery standing for the current UTC day.
  bool welfare_eligible = 11;
  // Jade this claim would credit, given the current balance. The top-up sets
  // the balance to the Bamboo minimum, so this shrinks as the balance rises.
  int64 welfare_amount = 12;
  // Stable reason code, not display text: available, balance_sufficient,
  // claimed_today, practice_hand_required, reservation_open.
  string welfare_reason = 13;
}

message JadeReservation {
  string reservation_id = 1;
  int64 amount = 2;
  string status = 3;
}

message JadeSettlement {
  string seat = 1;
  int64 delta = 2;
  int64 balance_before = 3;
  int64 balance_after = 4;
  string journal_id = 5;
}

message Tile {
  string id = 1;
  string kind = 2;
  uint32 rank = 3;
  uint32 copy = 4;
}

message PlayerView {
  string seat = 1;
  int32 hand_count = 2;
  repeated Tile exposed = 3;
  int32 meld_count = 4;
  repeated MeldView melds = 5;
  bool taken_over = 6;
  // is_bot reports whether this seat was never assigned to a human (AI
  // Practice mode), distinct from the broader taken_over — a client uses
  // this to show "Bot" instead of "Auto-playing (disconnected)", which
  // would be misleading for a seat that was never a human to begin with.
  bool is_bot = 7;
  // The playing style seated here, set only when is_bot is true. A
  // disconnect takeover leaves these empty: that seat plays the neutral
  // policy because its owner chose no style for it.
  //
  // bot_style_tag is the plain-language label ("Rush", "Guard") and matters
  // more to a player than bot_persona_name; bot_persona_id is the stable
  // key, and bot_glyph is the character shown beside the name so adding a
  // personality stays a data change rather than a client edit. A client
  // that has none of these falls back to plain "Bot".
  string bot_persona_id = 8;
  string bot_persona_name = 9;
  string bot_style_tag = 10;
  string bot_glyph = 11;
}

// Meld is the full, unredacted representation used where redaction is not
// required: a seat's own melds (MatchState.own_melds) and revealed winning
// hand decompositions (HandShape.melds) after showdown.
message Meld {
  string type = 1;
  repeated Tile tiles = 2;
  bool concealed = 3;
  bool added = 4;
  bool claimed = 5;
}

// MeldView is the redacted representation used for other players'
// melds (PlayerView.melds): tiles are omitted for a concealed Kong.
message MeldView {
  string type = 1;
  repeated Tile tiles = 2;
  bool concealed = 3;
}

message WaitTileView {
  Tile tile = 1;
  int32 visible_remaining = 2;
}

message WallView {
  int32 remaining = 1;
  int32 drawable_remaining = 2;
  int32 reserve_remaining = 3;
}

message Discard {
  string seat = 1;
  Tile tile = 2;
  uint64 sequence = 3;
}

message ClaimView {
  string action_id = 1;
  uint64 state_version = 2;
  Discard discard = 3;
  string deadline = 4;
  repeated string eligible = 5;
  ClaimResponse own_response = 6;
  ClaimOptionsView options = 7;
}

message ClaimResponse {
  string action_id = 1;
  string seat = 2;
  string type = 3;
  repeated string tile_ids = 4;
  uint64 state_version = 5;
  uint64 response_revision = 6;
  bool deliberate = 7;
}

// ChowSet is one legal Chow completion: the two tiles from the responding
// seat's own hand that would join the discard.
message ChowSet {
  repeated string tile_ids = 1;
}

message ClaimOptionsView {
  bool can_win = 1;
  bool can_pong = 2;
  bool can_kong = 3;
  repeated ChowSet chow_sets = 4;
  ScoreResult win_preview = 5;
}

message ScoreContext {
  string seat = 1;
  string prevailing_wind = 2;
  bool discard_win = 3;
  bool zimo = 4;
  bool replacement = 5;
  bool last_tile = 6;
  bool robbed_added_kong = 7;
  bool eight_flowers = 8;
  bool earthly_hand = 9;
  bool heavenly_hand = 10;
  bool single_wait = 11;
}

message PatternScore {
  string name = 1;
  int32 tai = 2;
}

message HandShape {
  repeated Tile pair = 1;
  repeated Meld melds = 2;
}

message ScoreResult {
  bool winning = 1;
  int32 raw_tai = 2;
  repeated PatternScore patterns = 3;
  HandShape shape = 4;
  int32 effective_tiles = 5;
}

message HandWinner {
  string seat = 1;
  ScoreContext context = 2;
  ScoreResult score = 3;
}

message DrawSeatAnalysis {
  string seat = 1;
  bool tenpai = 2;
  repeated WaitTileView waits = 3;
}

message HandResult {
  string kind = 1;
  repeated HandWinner winners = 2;
  string payer = 3;
  string winning_tile_id = 4;
  repeated DrawSeatAnalysis draw_analysis = 5;
}

message Transfer {
  string from = 1;
  string to = 2;
  int64 effective_tai = 3;
  int64 raw_amount = 4;
  int64 amount = 5;
  bool capped = 6;
  PaymentCalculation calculation = 7;
}

message PaymentComponent {
  string kind = 1;
  int64 units = 2;
  int64 amount = 3;
}

message PaymentCalculation {
  string method_id = 1;
  string model = 2;
  int64 unit_value = 3;
  repeated PaymentComponent components = 4;
  int64 multiplier = 5;
}

message SettlementMethod {
  string id = 1;
  string model = 2;
  int64 base_units = 3;
  int64 tai_cap = 4;
  int64 dealer_multiplier = 5;
}

message Settlement {
  repeated Transfer transfers = 1;
  map<string, int64> net = 2;
  int64 total_credits = 3;
  int64 total_debits = 4;
  SettlementMethod method = 5;
}

message ContinuationOutcome {
  string next_dealer = 1;
  int32 next_continuations = 2;
  bool dealer_retains = 3;
}

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Mahjong Match Service API";
    version: "v1";
  };
  base_path: "/mahjong";

  security_definitions: {
    security: {
      key: "Bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
      }
    }
  };
};
