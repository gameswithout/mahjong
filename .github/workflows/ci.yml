name: CI

# E0.F2: per-PR build, unit, and deterministic rendered-UI checks across every
# toolchain in the monorepo. This remains a verification gate rather than a
# public preview deployment; migrations and IaC (E0.F3/F6) stay out of scope.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-root:
    name: Go (root module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # bots is excluded from -race: it is CPU-bound simulation, not
      # concurrency-sensitive code, and the race detector's overhead there
      # is ~9x (28s -> 260s) for no correctness signal specific to this
      # package. The concurrency-relevant packages (server/match etc.)
      # are covered.
      - run: go test $(go list ./... | grep -v '/bots$') -race -count=1
      - run: go test ./bots/... -count=1

  go-match-service:
    name: Go (mahjong-match-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mahjong-match-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: mahjong-match-service/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1
      # This module's Docker image builds with -mod=vendor against a
      # vendor/ directory that is gitignored and regenerated on demand
      # (see mahjong-match-service/Dockerfile) — never committed, so
      # there is nothing to diff for staleness. What CI can and should
      # catch is a vendor build that would fail outright, e.g. a source
      # change in the replaced root module (rulesengine/bots) that the
      # normal (non-vendor) build above wouldn't exercise the same way.
      - run: go mod vendor
      - run: go build -mod=vendor ./...

  client:
    name: Client (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  ui-evidence:
    name: UI evidence (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Validate rendered UI and bundle budgets
        run: npm run evidence:ui
      - name: Upload rendered UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence-${{ github.sha }}
          path: .artifacts/ui-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
